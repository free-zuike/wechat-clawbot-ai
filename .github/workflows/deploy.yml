# ============================================
# ClawBot AI - 自动部署到 Cloudflare Workers
# ============================================
# 只需设置 1 个 Secret：
#   - CLOUDFLARE_API_TOKEN  (token 可访问的账号将自动解析)
# D1 数据库 / KV Namespace / Queue 自动创建或复用
# account_id 通过 token 调用 Cloudflare API 自动获取，无需手动配置

name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolve Cloudflare Account ID
        id: account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ACCOUNTS=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/accounts" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json")
          ACCOUNT_ID=$(echo "$ACCOUNTS" | jq -r '.result[0].id')
          if [ -z "$ACCOUNT_ID" ] || [ "$ACCOUNT_ID" = "null" ]; then
            echo "❌ 无法从 token 解析 account_id"
            echo "请确认 token 有 Account 级别读写权限: Worker Scripts / D1 / KV / Queues"
            echo "API 响应: $ACCOUNTS"
            exit 1
          fi
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "✅ Cloudflare Account ID: $ACCOUNT_ID"

      - name: Setup D1 Database
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ACCOUNT_ID="${{ steps.account.outputs.account_id }}"
          D1_LIST=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/d1/database" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json")
          D1_ID=$(echo "$D1_LIST" | jq -r '.result[] | select(.name=="clawbot-logs") | .uuid' | head -n1)
          if [ -z "$D1_ID" ] || [ "$D1_ID" = "null" ]; then
            D1_CREATE=$(curl -s -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/d1/database" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"name":"clawbot-logs"}')
            D1_ID=$(echo "$D1_CREATE" | jq -r '.result.uuid')
            if [ -z "$D1_ID" ] || [ "$D1_ID" = "null" ]; then
              echo "❌ D1 数据库创建失败"
              echo "API 响应: $D1_CREATE"
              exit 1
            fi
            echo "✅ D1 数据库已创建: $D1_ID"
          else
            echo "✅ D1 数据库已存在: $D1_ID"
          fi
          echo "d1_id=$D1_ID" >> $GITHUB_OUTPUT

      - name: Setup KV Namespace
        id: kv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ACCOUNT_ID="${{ steps.account.outputs.account_id }}"
          KV_LIST=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/storage/kv/namespaces" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json")
          KV_ID=$(echo "$KV_LIST" | jq -r '.result[] | select(.title=="clawbot-kv") | .id' | head -n1)
          if [ -z "$KV_ID" ] || [ "$KV_ID" = "null" ]; then
            KV_CREATE=$(curl -s -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/storage/kv/namespaces" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"title":"clawbot-kv"}')
            KV_ID=$(echo "$KV_CREATE" | jq -r '.result.id')
            if [ -z "$KV_ID" ] || [ "$KV_ID" = "null" ]; then
              echo "❌ KV Namespace 创建失败"
              echo "API 响应: $KV_CREATE"
              exit 1
            fi
            echo "✅ KV Namespace 已创建: $KV_ID"
          else
            echo "✅ KV Namespace 已存在: $KV_ID"
          fi
          echo "kv_id=$KV_ID" >> $GITHUB_OUTPUT

      - name: Setup Queue
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
        run: |
          # 队列不存在时会报错，忽略即可（已存在则跳过）
          set +e
          npx wrangler queues create clawbot-tasks 2>&1 | tail -2
          set -e
          echo "✅ Queue clawbot-tasks 就绪"

      - name: Update wrangler.toml with resource IDs
        run: |
          D1_ID="${{ steps.d1.outputs.d1_id }}"
          KV_ID="${{ steps.kv.outputs.kv_id }}"
          sed -i "s|^database_id = \".*\"|database_id = \"$D1_ID\"|" wrangler.toml
          sed -i "s|^id = \".*\"|id = \"$KV_ID\"|; s|^preview_id = \".*\"|preview_id = \"$KV_ID\"|" wrangler.toml
          echo "✅ 已更新 wrangler.toml"
          grep -E "database_id|^id =|^preview_id" wrangler.toml

      - name: Run D1 Migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
        run: |
          echo "=== 运行 D1 数据库迁移 ==="
          npx wrangler d1 migrations apply clawbot-logs --remote

      - name: Build frontend
        run: npm run build

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
        run: npx wrangler deploy

      - name: Deployment Info
        run: |
          echo "🦞 ClawBot AI 部署完成!"
          echo "📍 访问地址: https://wechat-clawbot-ai.${{ steps.account.outputs.account_id }}.workers.dev"
          echo "🔑 管理后台需在 Cloudflare Dashboard → Workers → 设置 → 变量中配置 ADMIN_PASSWORD"