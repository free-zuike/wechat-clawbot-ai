# ============================================================
#  🦞 ClawBot AI - Cloudflare Worker 配置
#  架构参考 bee-swarm:
#    - src/worker/   后端路由和服务
#    - web/          Vue 前端源码（通过 npm run build 构建到 dist/）
# ============================================================

name = "wechat-clawbot-ai"
main = "src/worker/index.ts"
compatibility_date = "2026-03-24"
compatibility_flags = ["nodejs_compat"]

# 静态资源目录（Vite 构建产物）
assets = { directory = "./dist", binding = "ASSETS" }

# 智能放置：允许 DO 实例迁移到资源附近的机房（换出口 IP，绕开 Agnes 对旧出口段的 1015 封禁）
# 注意：必须放在所有顶层键之后，否则 TOML 会把后续键吞进 [placement] 表
[placement]
mode = "smart"

# ===== 部署策略 =====
# Durable Object 迁移必须使用非版本化部署
# 详见: https://developers.cloudflare.com/workers/configuration/versions-and-deployments/gradual-deployments/#gradual-deployments-for-durable-objects
[deployment]
strategy = "all_at_once"

# ===== Cron 触发器 =====
# 每 2 分钟自动拉取一次微信消息，每分钟检查视频任务
[triggers]
crons = ["*/2 * * * *"]

# ===== AI 绑定 =====
[ai]
binding = "AI"

# ===== 浏览器渲染（搜索兜底，免费版每天 2 次会话）=====
[browser]
binding = "BROWSER"

# ===== Queues（异步任务）=====
[[queues.producers]]
queue = "clawbot-tasks"
binding = "CLAWBOT_QUEUE"

[[queues.consumers]]
queue = "clawbot-tasks"
max_retries = 2
max_batch_size = 1

# ===== KV 存储 (必需) =====
[[kv_namespaces]]
binding = "CLAWBOT_KV"
id = "2fac06f019ce476084f5066e432a1183"
preview_id = "2fac06f019ce476084f5066e432a1183"

# ===== D1 数据库（持久化存储）=====
[[d1_databases]]
binding = "DB"
database_name = "clawbot-logs"
database_id = "8879b820-de3c-4434-aab1-924f042712d1"

# ===== Durable Objects =====
# iLink 长轮询连接管理，实现实时消息接收
[[durable_objects.bindings]]
name = "ILINK_CONNECTION"
class_name = "ILinkConnectionDO2"

# v2 已应用（保持原样），v3 重命名类（CF 不允许 delete-class 同时保留 binding，
# 用官方支持的 renamed_classes 触发实例重建，Smart Placement 下可能换机房出口 IP）
[[migrations]]
tag = "v2"
new_sqlite_classes = [ "ILinkConnectionDO" ]

[[migrations]]
tag = "v3"
renamed_classes = [{ from = "ILinkConnectionDO", to = "ILinkConnectionDO2" }]

# ===== 关闭自动追踪日志 =====
[observability.logs]
enabled = false

[observability.traces]
enabled = false

