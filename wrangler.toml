# ============================================================
#  爪爪 ClawBot AI —— 基于 Cloudflare Worker + Worker AI 的微信个人号机器人
#
#  部署:
#    1)  npm install
#    2)  wrangler login
#    3)  wrangler kv:namespace create CLAWBOT_KV
#        把返回的 id 填到下面 [[kv_namespaces]] 的 id 字段
#    4)  wrangler deploy
#    5)  打开 https://<你的域名>/login 扫码登录
# ============================================================

name = "wechat-clawbot-ai"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# 每 2 分钟触发一次消息拉取 (v1.1 优化 —— 降低免费额度占用)
# 想更实时可改回 "* * * * *"
[triggers]
crons = ["*/2 * * * *"]

# ===== AI 绑定 =====
[ai]
binding = "AI"

# ===== KV 存储 (v1.1 仅保留: bot_token 凭证 + msg_id 去重) =====
# 对话上下文已迁移到 Cache API, 零写额度消耗
# 注意: 首次部署前请执行: wrangler kv:namespace create CLAWBOT_KV
[[kv_namespaces]]
binding = "CLAWBOT_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# ===== 可选: 管理员密码 (用来保护 /login 等管理页,不填则任何人都可以访问) =====
# [vars]
# ADMIN_PASSWORD = "change-this"
# AI_SYSTEM_PROMPT = "你是爪爪，一个友好的 AI 助手..."

# ===== 或使用 secret,更安全: wrangler secret put ADMIN_PASSWORD =====
