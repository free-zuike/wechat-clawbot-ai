# ============================================================
#  🦞 ClawBot AI - Cloudflare Worker 配置
#  架构参考 bee-swarm:
#    - src/worker/   后端路由和服务
#    - web/          Vue 前端源码（通过 npm run build 构建到 dist/）
# ============================================================

name = "wechat-clawbot-ai"
main = "src/worker/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# 静态资源目录（Vite 构建产物）
assets = { directory = "./dist", binding = "ASSETS" }

# ===== Cron 触发器 =====
# 每 2 分钟自动拉取一次微信消息并回复
[triggers]
crons = ["*/2 * * * *"]

# ===== AI 绑定 =====
[ai]
binding = "AI"

# ===== KV 存储 (必需) =====
[[kv_namespaces]]
binding = "CLAWBOT_KV"
id = "2fac06f019ce476084f5066e432a1183"
preview_id = "2fac06f019ce476084f5066e432a1183"

# ===== R2 长期对话历史 (可选) =====
[[r2_buckets]]
binding = "CLAWBOT_R2"
bucket_name = "clawbot-history"
preview_bucket_name = "clawbot-history"

# ===== D1 数据库 (可选，目前未启用) =====
# 需要持久化消息历史 / 长期统计数据时启用
# 1) 创建数据库:  npx wrangler d1 create clawbot-db
# 2) 把返回的 database_id 填入下面两行，并取消 [[d1_databases]] 注释
#
# [[d1_databases]]
# binding = "CLAWBOT_DB"
# database_name = "clawbot-db"
# database_id = "把-database_id-替换成-你的实际-id"

# ===== 开启日志 =====
[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true

