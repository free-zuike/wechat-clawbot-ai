name = "wechat-clawbot-ai"
main = "src/worker/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# 静态资源目录（Vite 构建后的产物）
assets = { directory = "dist" }

# ===== Cron 触发器 (可选) =====
# [triggers]
# crons = ["*/2 * * * *"]

# ===== AI 绑定 =====
[ai]
binding = "AI"

# ===== KV 存储 (必需) =====
[[kv_namespaces]]
binding = "CLAWBOT_KV"
id = "2fac06f019ce476084f5066e432a1183"
preview_id = "2fac06f019ce476084f5066e432a1183"

# ===== R2 长期对话历史 (可选) =====
[[r2_buckets]]
binding = "CLAWBOT_R2"
bucket_name = "clawbot-history"
preview_bucket_name = "clawbot-history"
