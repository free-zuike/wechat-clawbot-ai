# ============================================================
#  🦞 ClawBot AI - Cloudflare Worker 配置
#  架构参考 bee-swarm:
#    - src/worker/   后端路由和服务
#    - web/          Vue 前端源码（通过 npm run build 构建到 dist/）
# ============================================================

name = "wechat-clawbot-ai"
main = "src/worker/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# 静态资源目录（Vite 构建产物）
assets = { directory = "./dist", binding = "ASSETS" }

# ===== 部署策略 =====
# Durable Object 迁移必须使用非版本化部署
# 详见: https://developers.cloudflare.com/workers/configuration/versions-and-deployments/gradual-deployments/#gradual-deployments-for-durable-objects
[deployment]
strategy = "all_at_once"

# ===== Cron 触发器 =====
# 每 2 分钟自动拉取一次微信消息并回复
[triggers]
crons = ["*/2 * * * *"]

# ===== AI 绑定 =====
[ai]
binding = "AI"

# ===== KV 存储 (必需) =====
[[kv_namespaces]]
binding = "CLAWBOT_KV"
id = "2fac06f019ce476084f5066e432a1183"
preview_id = "2fac06f019ce476084f5066e432a1183"

# ===== R2 长期对话历史 (可选) =====
[[r2_buckets]]
binding = "CLAWBOT_R2"
bucket_name = "clawbot-history"
preview_bucket_name = "clawbot-history"

# ===== D1 数据库 =====
# messages / sessions / stats 持久化存储
[[d1_databases]]
binding = "CLAWBOT_DB"
database_name = "clawbot-db"
database_id = "f430014e-6323-4318-b7b3-ea6f83f17541"

# ===== Durable Objects =====
# iLink 长轮询连接管理，实现实时消息接收
[[durable_objects.bindings]]
name = "ILINK_CONNECTION"
class_name = "ILinkConnectionDO"

# Durable Objects 迁移配置（免费计划必须使用 new_sqlite_classes）
[[migrations]]
tag = "v2"
new_sqlite_classes = [ "ILinkConnectionDO" ]

# ===== 开启日志 =====
[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true

