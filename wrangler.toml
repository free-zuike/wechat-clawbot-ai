# ============================================================
#  🦞 ClawBot AI - Cloudflare Worker 配置
#  架构参考 bee-swarm:
#    - src/worker/   后端路由和服务
#    - web/          Vue 前端源码（通过 npm run build 构建到 dist/）
# ============================================================

name = "wechat-clawbot-ai"
main = "src/worker/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# 静态资源目录（Vite 构建产物）
assets = { directory = "./dist", binding = "ASSETS" }

# ===== Cron 触发器 (可选) =====
# 取消注释后，每 2 分钟自动拉取一次消息
# [triggers]
# crons = ["*/2 * * * *"]

# ===== AI 绑定 =====
[ai]
binding = "AI"

# ===== KV 存储 (必需) =====
[[kv_namespaces]]
binding = "CLAWBOT_KV"
id = "2fac06f019ce476084f5066e432a1183"
preview_id = "2fac06f019ce476084f5066e432a1183"

# ===== R2 长期对话历史 (可选) =====
[[r2_buckets]]
binding = "CLAWBOT_R2"
bucket_name = "clawbot-history"
preview_bucket_name = "clawbot-history"

# ===== 开启日志 =====
[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]

