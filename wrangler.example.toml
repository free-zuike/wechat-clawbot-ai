# ==============================
#  ClawBot AI - 示例配置文件
# ==============================
# 复制为 wrangler.toml 后填入自己的值,然后 wrangler deploy
# 注意: wrangler.toml 不要提交到公开仓库 (会泄露 app secret/token)

name = "wechat-clawbot-ai"
main = "src/index.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# ---------- 推荐使用 secret,不要在 wrangler.toml 中写死 ----------
# wrangler secret put WECHAT_TOKEN
# wrangler secret put WECHAT_APP_ID
# wrangler secret put WECHAT_APP_SECRET

# ---------- 可选: 用 KV 保存多轮对话上下文 ----------
# wrangler kv:namespace create CLAWBOT_KV
# 然后把返回的 id 填到下面
# [[kv_namespaces]]
# binding = "CLAWBOT_KV"
# id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

[ai]
binding = "AI"
